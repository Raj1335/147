services:
  - type: web
    name: sih26147-signal-workbench
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.address 0.0.0.0 --server.port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: SIH_HOSTED
        value: "true"
