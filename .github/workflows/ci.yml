name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .[dev]

      - name: Lint
        run: python -m ruff check .

      - name: Type-check
        run: python -m mypy --config-file pyproject.toml sih26147

      - name: Check Markdown files for NUL bytes
        run: python -c "from pathlib import Path; bad = [str(p) for p in Path('.').rglob('*.md') if b'\0' in p.read_bytes()]; print('\n'.join(bad)); raise SystemExit(bool(bad))"

      - name: Test with coverage
        run: python -m pytest --cov=sih26147 --cov-report=term-missing

      - name: Audit dependencies
        run: python -m pip_audit -r requirements.txt
